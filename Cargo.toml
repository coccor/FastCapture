[package]
name = "fastcapture"
version = "0.1.0"
edition = "2024"
description = "Capture anything on Windows and turn it into well-written Markdown notes."
license = "MIT"
build = "build.rs"

[dependencies]
serde_json = "=1.0.151"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
